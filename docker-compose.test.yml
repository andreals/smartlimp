services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartlimp
      POSTGRES_PASSWORD: test
      POSTGRES_DB: smartlimp_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlimp -d smartlimp_test"]
      interval: 2s
      timeout: 5s
      retries: 15
